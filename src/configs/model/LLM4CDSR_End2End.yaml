# LLM4CDSR end-to-end runtime variant: generate its own item embeddings and user profiles.
only_overlap_users: False
k_cores: 3
shuffle_user_sequence: True
warm_valid_ratio: 0
warm_test_ratio: 0
t_cold_valid: 0.1
t_cold_test: 0.1

warm_eval: False
cold_start_eval: True
req_training: True

training_stages:
  - name: target_both
    state: BOTH
    epochs: 1000
    train_batch_size: 2048
    learner: adam
    learning_rate: [0.001]
    learning_rate_scheduler: [1.0, 50]
    weight_decay: 0

modalities:
  - name: "CrossDomain_semantics_LLM4CDSR_end2end"
    llm_chat_model: "gpt-4o-mini"
    emb_model: "text-embedding-3-large"
    emb_batch_size: 1024
    emb_dim: 3072
    emb_pca: 3072
    normalize_semantic_emb: False
    cluster_k: 2
    max_retry: 2
    profile_num_workers: 20
    repair_max_rounds: 0
    repair_sleep_seconds: 0
    embedding_request_timeout: 60
    embedding_num_workers: 1
    embedding_max_retry: 3
    openai_max_retries: 0
    enabled: true

embedding_dim: 64
user_llm_emb_w: 1
item_llm_emb_w: 1
gamma: 0.2
tau: 0.2

alpha: [0.00001, 0.001, 0.01, 0.1]
beta: [0.001]
history_len: [40]
log_model_suffix: end2end_own_item_emb

hyper_parameters:
  - "training_stages.0.learning_rate"
  - "alpha"
  - "beta"
  - "history_len"
