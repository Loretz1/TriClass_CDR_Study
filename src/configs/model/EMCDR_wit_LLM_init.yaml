# Overwrite Dataset Setting
only_overlap_users: False
k_cores: 3
shuffle_user_sequence: True
warm_valid_ratio: 0
warm_test_ratio: 0
t_cold_valid: 0.1
t_cold_test: 0.1

# 1. Eval Setting
warm_eval: False
cold_start_eval: True

# 2. Multi-stage Training Setting
# Fixed to the best available EMCDR Phone -> Electronics setting:
# seed=999, source epochs=10, target epochs=10, mapping lr=0.01, mlp_layers=0.
training_stages:
  - name: source_training
    state: SOURCE
    epochs: 10
    train_batch_size: 2048
    learner: adam
    learning_rate: 0.01
    learning_rate_scheduler: [1.0, 50]
    weight_decay: 0.0
  - name: target_training
    state: TARGET
    epochs: 10
    train_batch_size: 2048
    learner: adam
    learning_rate: 0.01
    learning_rate_scheduler: [1.0, 50]
    weight_decay: 0.0
  - name: mapping_training
    state: OVERLAP_USER
    epochs: 1000
    train_batch_size: 2048
    learner: adam
    learning_rate: 0.01
    learning_rate_scheduler: [1.0, 50]
    weight_decay: 0.0

modalities:
  - name: "CrossDomain_semantics_both_tag"
    emb_model: "text-embedding-3-large"
    emb_batch_size: 1024
    emb_dim: 3072
    emb_pca: 3072
    normalize_semantic_emb: False
    enabled: true

# 3. Fixed Model Parameters Setting
feature_dim: 64
mlp_hidden_dim: 128
dropout: 0.2
loss_type: bpr
mlp_layers: 0

# 4. Fixed pseudo-supervision setting
pseudo_build_batch_size: 2048

# Reuse source/target pretraining while searching pseudo-only settings.
reuse_pretrained_stage_cache: True
reuse_pretrained_until_stage: 2
pretrained_stage_cache_dir: pretrained_stage_cache
pretrained_stage_cache_name: emcdr_wit_llm_init_amazon_phone_elec_seed999_source_target

# Local pseudo supervision search for Phone -> Electronics.
top_k_pos: [2, 3, 5]
pseudo_start_epoch: [5, 10, 15, 20]
pseudo_num_per_batch: [4, 8, 16]

log_model_suffix: llm_init_phone_elec_refined_pseudo_search

# Search around the balanced previous best.
pseudo_rec_weight: [0.00003, 0.0001, 0.0003, 0.001]

hyper_parameters:
  - top_k_pos
  - pseudo_start_epoch
  - pseudo_num_per_batch
  - pseudo_rec_weight
