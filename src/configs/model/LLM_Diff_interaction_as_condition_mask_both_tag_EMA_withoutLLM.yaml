# LSDCDR w/o LLM summarization.
# Semantic embeddings are generated by directly embedding concatenated raw
# user/item profiles with text-embedding-3-large. Training keeps the Music->Book
# best LSDCDR hyper-parameters from Table 2.

only_overlap_users: False
k_cores: 3
shuffle_user_sequence: True
warm_valid_ratio: 0
warm_test_ratio: 0
t_cold_valid: 0.1
t_cold_test: 0.1

warm_eval: False
cold_start_eval: True
req_training: True

training_stages:
  - name: target_both
    state: BOTH
    epochs: 1000
    train_batch_size: 2048
    learner: adam
    learning_rate: [0.001]
    learning_rate_scheduler: [1.0, 50]
    weight_decay: 0

modalities:
  - name: "CrossDomain_semantics_both_tag_withoutllm"
    semantic_source: "raw_profile_without_llm_summary"
    emb_model: "text-embedding-3-large"
    emb_batch_size: 64
    max_chars_per_embedding_request: 120000
    embedding_num_workers: 6
    embedding_max_retry: 10
    embedding_request_timeout: 300
    emb_dim: 3072
    emb_pca: 3072
    normalize_semantic_emb: False
    withoutllm_max_chars_per_user: 3000
    withoutllm_max_chars_per_item: 1200
    request_timeout: 300
    openai_max_retries: 2
    enabled: true

embedding_dim: 64
timesteps: [20]
beta_start: 0.0001
beta_end: 0.7
dropout: 0.3

top_k_pos: [1]
pseudo_start_epoch: [0]
pseudo_num_per_batch: 16
pseudo_rec_weight: 0.001
ema_momentum: 0.999
pseudo_update_interval: 5

diff_weight: [0.5]
beta_sche: ['linear']
lambda_user_emb: [2]
aggregator: ['user_attention']
history_len: [150]
mask_rate: [0.3]

hyper_parameters:
  - "timesteps"
  - "top_k_pos"
  - "pseudo_start_epoch"
  - "beta_sche"
  - "training_stages.0.learning_rate"
  - "diff_weight"
  - "lambda_user_emb"
  - "aggregator"
  - "history_len"
  - "mask_rate"
