# Match each user's original deduplicated three-route candidate count.
reference_config: configs/model/GroundedTriClass.yaml
data_path: ../data
seed: 999
num_threads: 4
candidate_budget: match_original_union_per_user
final_top_k: 5
rrf_constant: 60
loss_weighting: uniform
cdrib_model: CDRIB_Grounded_TriClass_Deterministic
variants: [semantic, user_g, popularity, union_rrf, trusted]
tasks:
  ClothSport:
    domains: [Clothing_Shoes_and_Jewelry, Sports_and_Outdoors]
    backbones:
      EMCDR: [0.1, 0.25]
      UniCDR: [0.1, 0.0]
      CD_CDR_Normal: [1.0, 0.0]
      CDRIB: [0.1, 0.25]
  PhoneElec:
    domains: [Cell_Phones_and_Accessories, Electronics]
    backbones:
      EMCDR: [0.1, 0.0]
      UniCDR: [1.0, 0.5]
      CD_CDR_Normal: [1.0, 0.25]
      CDRIB: [1.0, 0.5]
