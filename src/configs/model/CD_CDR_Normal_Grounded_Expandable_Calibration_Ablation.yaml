only_overlap_users: false
k_cores: 3
shuffle_user_sequence: true
warm_valid_ratio: 0
warm_test_ratio: 0
t_cold_valid: 0.1
t_cold_test: 0.1

warm_eval: false
cold_start_eval: true
valid_metric: Recall@20

training_stages:
  - name: both_training
    state: BOTH
    epochs: 1000
    train_batch_size: 2048
    learner: adam
    learning_rate: 0.0001
    learning_rate_scheduler: [1.0, 50]
    weight_decay: 0.0000001

embedding_size: 64
neg_seq_len: 1
diffuser_type: mlp1
timestep: 2000
uncon_w: 5
uncon_p: 0.1
beta_sche: linear
dropout: 0.1
layer_norm: 1
n_heads: 4
n_layers: 1
mean_pooling: 0
loss_n: bpr
gamma: 0.5
disable_diffusion: false
aggregator: user_attention
history_len: 10

normal_fusion_attention_weight: 0.5
normal_direct_score_weight: 0.5
normal_diffusion_scale_clip: 20.0
inference_noise_seed: 2027

pseudo_cache_path: auto
grounded_confidence_cache_path: auto
pseudo_loss_weight: 0.0001
pseudo_start_epoch: 0
pseudo_num_per_batch: 256
pseudo_sampler_seed: 999
confidence_source: combined
confidence_power: 0.5
confidence_epsilon: 0.00000001

adaptive_setting: j1_b0
adaptive_stage_id: 0
adaptive_hidden_dim: 32
adaptive_residual_loss_weight: 1.0
adaptive_residual_l2: 0.0001
adaptive_gate_temperature: 0.025
adaptive_gate_floor: 0.0
residual_candidate_pool_size: 100
residual_retained_user_fraction: 0.05
residual_top_k: 1
residual_sampling_power: 1.0
residual_loss_confidence_scale: 1.0
residual_num_per_batch: 512
residual_score_scale_clip: 20.0

v3_setting: broad
calibration_ablation: [mean_all, without_semantic, without_overlap]
ema_teacher_decay: 0.995
expansion_start_epoch: 10
expansion_interval: 10
expansion_max_rounds: 3
expansion_top_k: 1
max_pseudo_items_per_user: 8
dynamic_user_batch_size: 48
dynamic_calibrator_candidate_width: 20
dynamic_calibrator_user_split: [0.6, 0.2, 0.2]
dynamic_calibrator_learning_rate: 0.01
dynamic_calibrator_weight_decay: 0.0001
dynamic_calibrator_batch_size: 65536
dynamic_calibrator_inference_batch_size: 262144
dynamic_calibrator_max_epochs: 60
dynamic_calibrator_patience: 8
dynamic_calibrator_minimum_delta: 0.000001
dynamic_positive_weight_cap: 100.0
dynamic_calibration_quantile: 0.90
dynamic_min_validation_precision: 0.05
dynamic_min_validation_hits: 3
dynamic_min_confidence: 0.0
dynamic_anchor_quantile: 0.0
dynamic_max_neighbor_target_items: 64

log_model_suffix: normal_grounded_stage3_calibration_ablation
hyper_parameters:
  - calibration_ablation

domain_profiles:
  Book+Music:
    adaptive_setting: j1_b0
    pseudo_loss_weight: 0.001
    confidence_source: overlap
    confidence_power: 1.0
    disable_diffusion: false
    aggregator: transformer
    history_len: 40
    gamma: 0.5
    dynamic_user_batch_size: 48
  Clothing_Shoes_and_Jewelry+Sports_and_Outdoors:
    adaptive_setting: j05_b0005
    v3_setting: broad
    pseudo_loss_weight: 0.01
    confidence_source: overlap
    confidence_power: 1.0
    disable_diffusion: true
    aggregator: self_attention
    history_len: 10
    gamma: 0.5
    dynamic_user_batch_size: 96
  Cell_Phones_and_Accessories+Electronics:
    adaptive_setting: j1_b0
    v3_setting: strict
    pseudo_loss_weight: 0.0001
    confidence_source: combined
    confidence_power: 0.5
    disable_diffusion: false
    aggregator: user_attention
    history_len: 10
    gamma: 0.5
    dynamic_user_batch_size: 48
