# Elec -> Phone pseudo-quality curve using the Table 2 best configuration.
only_overlap_users: False
k_cores: 3
shuffle_user_sequence: True
warm_valid_ratio: 0
warm_test_ratio: 0
t_cold_valid: 0.1
t_cold_test: 0.1

warm_eval: False
cold_start_eval: True

training_stages:
  - name: target_both
    state: BOTH
    epochs: 1000
    train_batch_size: 2048
    learner: adam
    learning_rate: [0.001]
    learning_rate_scheduler: [1.0, 50]
    weight_decay: 0.000001

modalities:
  - name: "CrossDomain_semantics_both_tag"
    emb_model: "text-embedding-3-large"
    emb_batch_size: 1024
    emb_dim: 3072
    emb_pca: 3072
    normalize_semantic_emb: False
    enabled: true

feature_dim: 64
dropout: 0.3
lambda_a: 0.5

timesteps: 20
beta_start: 0.0001
beta_end: 0.02

top_k_pos: 5
pseudo_start_epoch: 80
pseudo_num_per_batch: 16
pseudo_rec_weight: 0.0001
ema_momentum: 0.999
pseudo_update_interval: 5

pseudo_quality_topk: 20
pseudo_quality_metric_ks: [5, 10, 20]
pseudo_quality_record_dir: pseudo_quality_records
pseudo_quality_save_epoch_topk: True
pseudo_quality_eval_batch_size: 1024
pseudo_quality_rebuild_batch_size: 2048

history_len: [20]
aggregator: ['mean']
mask_rate: [0.4]
diff_weight: [0.5]
beta_sche: ['sqrt']
lambda_user_emb: [0.0001]

hyper_parameters:
  - "training_stages.0.learning_rate"
  - "history_len"
  - "aggregator"
  - "mask_rate"
  - "diff_weight"
  - "beta_sche"
  - "lambda_user_emb"
