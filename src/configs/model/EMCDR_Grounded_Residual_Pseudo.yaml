only_overlap_users: false
k_cores: 3
shuffle_user_sequence: true
warm_valid_ratio: 0
warm_test_ratio: 0
t_cold_valid: 0.1
t_cold_test: 0.1

warm_eval: false
cold_start_eval: true
valid_metric: Recall@20
stopping_step: 20

training_stages:
  - name: source_training
    state: SOURCE
    epochs: 10
    train_batch_size: 2048
    learner: adam
    learning_rate: 0.01
    learning_rate_scheduler: [1.0, 50]
    weight_decay: 0.0
  - name: target_training
    state: TARGET
    epochs: 10
    train_batch_size: 2048
    learner: adam
    learning_rate: 0.01
    learning_rate_scheduler: [1.0, 50]
    weight_decay: 0.0
  - name: mapping_training
    state: OVERLAP_USER
    epochs: 20
    train_batch_size: 2048
    learner: adam
    learning_rate: 0.01
    learning_rate_scheduler: [1.0, 50]
    weight_decay: 0.0
  - name: grounded_residual_training
    state: OVERLAP_USER
    epochs: 100
    train_batch_size: 2048
    learner: adam
    learning_rate: 0.05
    learning_rate_scheduler: [1.0, 50]
    weight_decay: 0.000001

feature_dim: 64
mlp_hidden_dim: 128
mlp_layers: 0
dropout: 0.2
loss_type: bpr

pseudo_cache_path: auto
grounded_confidence_cache_path: auto
confidence_source: combined
confidence_epsilon: 0.00000001
residual_candidate_pool_size: 100
residual_retained_user_fraction: [0.05, 0.10]
residual_top_k: 1
residual_sampling_power: 1.0
residual_loss_confidence_scale: 1.0
residual_num_per_batch: 512
residual_beta: [0.05, 0.10, 0.20]
residual_l2: 0.0001
residual_score_scale_clip: 20.0
residual_stage_id: 3

reuse_pretrained_stage_cache: true
reuse_pretrained_until_stage: 3
log_model_suffix: grounded_stage2_residual
hyper_parameters:
  - residual_retained_user_fraction
  - residual_beta

domain_profiles:
  Clothing_Shoes_and_Jewelry+Sports_and_Outdoors: {}
  Cell_Phones_and_Accessories+Electronics:
    training_stages:
      - name: source_training
        state: SOURCE
        epochs: 10
        train_batch_size: 2048
        learner: adam
        learning_rate: 0.01
        learning_rate_scheduler: [1.0, 50]
        weight_decay: 0.0
      - name: target_training
        state: TARGET
        epochs: 10
        train_batch_size: 2048
        learner: adam
        learning_rate: 0.01
        learning_rate_scheduler: [1.0, 50]
        weight_decay: 0.0
      - name: mapping_training
        state: OVERLAP_USER
        epochs: 26
        train_batch_size: 2048
        learner: adam
        learning_rate: 0.01
        learning_rate_scheduler: [1.0, 50]
        weight_decay: 0.0
      - name: grounded_residual_training
        state: OVERLAP_USER
        epochs: 100
        train_batch_size: 2048
        learner: adam
        learning_rate: 0.05
        learning_rate_scheduler: [1.0, 50]
        weight_decay: 0.000001
