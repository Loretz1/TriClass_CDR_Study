only_overlap_users: False
k_cores: 3
shuffle_user_sequence: True
warm_valid_ratio: 0
warm_test_ratio: 0
t_cold_valid: 0.1
t_cold_test: 0.1

warm_eval: False
cold_start_eval: True
req_training: True

training_stages:
  - name: target_both
    state: BOTH
    epochs: 1000
    train_batch_size: 2048
    learner: adam
    learning_rate: [0.001]
    learning_rate_scheduler: [1.0, 50]
    weight_decay: 0

modalities:
  - name: "CrossDomain_semantics_both_tag"
    emb_model: "text-embedding-3-large"
    emb_batch_size: 1024
    emb_dim: 3072
    emb_pca: 3072
    normalize_semantic_emb: False
    enabled: true

dropout: 0.3

# Original Sport -> Cloth LSDCDR best profile.
embedding_dim: 64
timesteps: [5]
beta_start: 0.0001
beta_end: 0.02
top_k_pos: [5]
pseudo_start_epoch: [5]
pseudo_num_per_batch: 32
pseudo_rec_weight: 0.001
ema_momentum: 0.999
pseudo_update_interval: 5
diff_weight: [1]
beta_sche: ['cosine']
lambda_user_emb: [0.001]
aggregator: ['user_attention']
history_len: [40]
mask_rate: [0.3]

generative_seed_offset: 10000
vae_hidden_dim: [64]
vae_latent_dim: [16]
vae_kl_weight: [0.01]
log_model_suffix: generative_ablation_vae

hyper_parameters:
  - "timesteps"
  - "top_k_pos"
  - "pseudo_start_epoch"
  - "beta_sche"
  - "training_stages.0.learning_rate"
  - "diff_weight"
  - "lambda_user_emb"
  - "aggregator"
  - "history_len"
  - "mask_rate"
  - "vae_hidden_dim"
  - "vae_latent_dim"
  - "vae_kl_weight"
