# Full LSDCDR with GPT-5.2 + text-embedding-3-large semantic pseudo supervision.
only_overlap_users: False
k_cores: 3
shuffle_user_sequence: True
warm_valid_ratio: 0
warm_test_ratio: 0
t_cold_valid: 0.1
t_cold_test: 0.1

warm_eval: False
cold_start_eval: True
req_training: True

training_stages:
  - name: target_both
    state: BOTH
    epochs: 1000
    train_batch_size: 2048
    learner: adam
    learning_rate: [0.001]
    learning_rate_scheduler: [1.0, 50]
    weight_decay: 0

modalities:
  - name: "CrossDomain_semantics_both_tag_gpt52_te3large_src_only_tgt_only"
    generation_scope: "src_only_tgt_only"
    llm_chat_model: "gpt-5.2"
    emb_model: "text-embedding-3-large"
    emb_batch_size: 1024
    emb_dim: 3072
    emb_pca: 3072
    normalize_semantic_emb: False
    max_retry: 3
    num_workers: 2
    request_timeout: 180
    embedding_request_timeout: 180
    openai_max_retries: 0
    enabled: true

embedding_dim: 64
timesteps: [200]
beta_start: 0.0001
beta_end: 0.5
dropout: 0.3

top_k_pos: [5]
pseudo_start_epoch: [80]
pseudo_num_per_batch: 16
pseudo_rec_weight: 0.001
ema_momentum: 0.999
pseudo_update_interval: 5

diff_weight: [0.5]
beta_sche: ['cosine']
lambda_user_emb: [0.001]
aggregator: ['user_attention']
history_len: [40]
mask_rate: [0.3]

hyper_parameters:
  - "timesteps"
  - "top_k_pos"
  - "pseudo_start_epoch"
  - "beta_sche"
  - "training_stages.0.learning_rate"
  - "diff_weight"
  - "lambda_user_emb"
  - "aggregator"
  - "history_len"
  - "mask_rate"
