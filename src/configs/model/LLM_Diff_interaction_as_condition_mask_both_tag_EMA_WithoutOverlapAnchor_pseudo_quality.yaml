# Cloth-to-Sport w/o Overlap-anchor pseudo-quality run with online pseudo
# refinement enabled from epoch 80.
only_overlap_users: False
k_cores: 3
shuffle_user_sequence: True
warm_valid_ratio: 0
warm_test_ratio: 0
t_cold_valid: 0.1
t_cold_test: 0.1

warm_eval: False
cold_start_eval: True
stopping_step: 150

training_stages:
  - name: target_both
    state: BOTH
    epochs: 1000
    train_batch_size: 2048
    learner: adam
    learning_rate: [0.001]
    learning_rate_scheduler: [1.0, 50]
    weight_decay: 0

modalities:
  - name: "CrossDomain_semantics_both_tag"
    emb_model: "text-embedding-3-large"
    emb_batch_size: 1024
    emb_dim: 3072
    emb_pca: 3072
    normalize_semantic_emb: False
    enabled: true

embedding_dim: 64
timesteps: [200]
beta_start: 0.0001
beta_end: 0.5
dropout: 0.3

top_k_pos: [5]
pseudo_start_epoch: [80]
pseudo_num_per_batch: 16
pseudo_rec_weight: 0.001
ema_momentum: 0.999
pseudo_update_interval: 5

overlap_rec_weight: [0.005]

diff_weight: [0.5]
beta_sche: ["cosine"]
lambda_user_emb: [0.001]
aggregator: ["user_attention"]
history_len: [40]
mask_rate: [0.3]

# Observer-only recording. quality_topk must not exceed top_k_pos.
pseudo_quality_topk: 5
pseudo_quality_metric_ks: [5]
pseudo_quality_record_dir: pseudo_quality_records
pseudo_quality_save_epoch_topk: True
pseudo_quality_eval_batch_size: 1024
pseudo_quality_rebuild_batch_size: 2048
pseudo_quality_expected_initial_recall: 0.00115819
pseudo_quality_initial_recall_tolerance: 0.00000001

log_model_suffix: "woa_pq"

hyper_parameters:
  - "timesteps"
  - "top_k_pos"
  - "pseudo_start_epoch"
  - "overlap_rec_weight"
  - "beta_sche"
  - "training_stages.0.learning_rate"
  - "diff_weight"
  - "lambda_user_emb"
  - "aggregator"
  - "history_len"
  - "mask_rate"
