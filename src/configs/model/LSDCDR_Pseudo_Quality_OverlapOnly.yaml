# LSDCDR pseudo-supervision quality diagnostic: overlap-only baseline.
only_overlap_users: False
k_cores: 3
shuffle_user_sequence: True
warm_valid_ratio: 0
warm_test_ratio: 0
t_cold_valid: 0.1
t_cold_test: 0.1

warm_eval: False
cold_start_eval: True
req_training: True

log_dir: './log_lsdcdr_pseudo_quality/'

training_stages:
  - name: target_both
    state: BOTH
    epochs: 1000
    train_batch_size: 2048
    learner: adam
    learning_rate: [0.001]
    learning_rate_scheduler: [1.0, 50]
    weight_decay: 0

modalities:
  - name: "CrossDomain_semantics_both_tag"
    emb_model: "text-embedding-3-large"
    emb_batch_size: 1024
    emb_dim: 3072
    emb_pca: 3072
    normalize_semantic_emb: False
    enabled: true

embedding_dim: 64
timesteps: [20]
beta_start: 0.0001
beta_end: 0.5
dropout: 0.3

top_k_pos: [5]
pseudo_set_size: 5
pseudo_start_epoch: [0]
pseudo_num_per_batch: [256]
pseudo_rec_weight: [0.1]
pseudo_seed: 999

target_mf_epochs: 50
target_mf_lr: 0.001
target_mf_batch_size: 2048
target_mf_embedding_dim: 64
target_mf_weight_decay: 0

diff_weight: [2]
beta_sche: ['sqrt']
lambda_user_emb: [0, 0.01, 0.1, 0.3]
aggregator: ['user_attention']
history_len: [40]
mask_rate: [0.3]

log_model_suffix: pseudo_quality_overlaponly

hyper_parameters:
  - "timesteps"
  - "top_k_pos"
  - "pseudo_start_epoch"
  - "beta_sche"
  - "training_stages.0.learning_rate"
  - "diff_weight"
  - "lambda_user_emb"
  - "aggregator"
  - "history_len"
  - "mask_rate"
  - "pseudo_num_per_batch"
  - "pseudo_rec_weight"
