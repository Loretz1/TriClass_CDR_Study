# End-to-end runtime analysis for LSDCDR on Douban Book -> Music.
# The runtime-specific modality forces fresh semantic generation unless its
# cache is already present. Delete the modality cache before re-running timing.
only_overlap_users: False
k_cores: 3
shuffle_user_sequence: True
warm_valid_ratio: 0
warm_test_ratio: 0
t_cold_valid: 0.1
t_cold_test: 0.1

warm_eval: False
cold_start_eval: True
req_training: True

runtime_record_dir: "runtime_records/lsdcdr_book_music_runtime"

training_stages:
  - name: target_both
    state: BOTH
    epochs: 1000
    train_batch_size: 2048
    learner: adam
    learning_rate: [0.001]
    learning_rate_scheduler: [1.0, 50]
    weight_decay: 0

modalities:
  - name: "CrossDomain_semantics_both_tag_douban_runtime_src_only_tgt_only"
    generation_scope: "src_only_tgt_only"
    llm_chat_model: "gpt-4o-mini"
    emb_model: "text-embedding-3-large"
    emb_batch_size: 1024
    emb_dim: 3072
    emb_pca: 3072
    normalize_semantic_emb: False
    max_retry: 2
    profile_num_workers: 20
    repair_max_rounds: 0
    repair_sleep_seconds: 0
    request_timeout: 60
    embedding_request_timeout: 60
    embedding_num_workers: 10
    embedding_max_retry: 3
    openai_max_retries: 0
    enabled: true

embedding_dim: 64
timesteps: [20]
beta_start: 0.0001
beta_end: 0.7
dropout: 0.3

top_k_pos: [1]
pseudo_start_epoch: [3]
pseudo_num_per_batch: 16
pseudo_rec_weight: 0.001
ema_momentum: 0.999
pseudo_update_interval: 5

diff_weight: [0.15]
beta_sche: ['linear']
lambda_user_emb: [1]
aggregator: ['user_attention']
history_len: [150]
mask_rate: [0.5]

log_model_suffix: runtime_book_music

hyper_parameters:
  - "seed"
  - "timesteps"
  - "top_k_pos"
  - "pseudo_start_epoch"
  - "training_stages.0.learning_rate"
  - "diff_weight"
  - "lambda_user_emb"
  - "beta_sche"
  - "aggregator"
  - "history_len"
  - "mask_rate"
