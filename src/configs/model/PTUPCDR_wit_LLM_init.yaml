# Overwrite Dataset Setting
only_overlap_users: False
k_cores: 3
shuffle_user_sequence: True
warm_valid_ratio: 0
warm_test_ratio: 0
t_cold_valid: 0.1
t_cold_test: 0.1

# 1. Eval Setting
warm_eval: False
cold_start_eval: True
valid_metric: Recall@20

# 2. Multi-stage Training Setting
training_stages:
  - name: source_training
    state: SOURCE
    epochs: 10
    train_batch_size: 2048
    learner: adam
    learning_rate: 0.01
    learning_rate_scheduler: [1.0, 50]
    weight_decay: 0.0
  - name: target_training
    state: TARGET
    epochs: 10
    train_batch_size: 2048
    learner: adam
    learning_rate: 0.01
    learning_rate_scheduler: [1.0, 50]
    weight_decay: 0.0
  - name: mapping_training
    state: OVERLAP
    epochs: 1000
    train_batch_size: 2048
    learner: adam
    learning_rate: [0.0003]
    learning_rate_scheduler: [1.0, 50]
    weight_decay: 0.0

modalities:
  - name: "CrossDomain_semantics_both_tag"
    emb_model: "text-embedding-3-large"
    emb_batch_size: 1024
    emb_dim: 3072
    emb_pca: 3072
    normalize_semantic_emb: False
    enabled: true

# 3. Fixed Model Parameters Setting
feature_dim: 64
meta_dim: 128
history_len: 40

# 4. Fixed pseudo-supervision setting
pseudo_build_batch_size: 2048

# Reuse source/target pretraining while searching mapping-stage pseudo settings.
reuse_pretrained_stage_cache: True
reuse_pretrained_until_stage: 2
pretrained_stage_cache_dir: pretrained_stage_cache
pretrained_stage_cache_name: ptupcdr_wit_llm_init_amazon_sport_cloth_seed999_source_target_hist40

# Sport -> Cloth light pseudo search, part 2/2.
top_k_pos: [1]
pseudo_start_epoch: [5]
pseudo_num_per_batch: [2, 4, 8]
pseudo_rec_weight: [0.00000001, 0.0000001, 0.000001]

log_model_suffix: llm_init_sport_cloth_light18_start5_pseudo_search

hyper_parameters:
  - training_stages.2.learning_rate
  - top_k_pos
  - pseudo_start_epoch
  - pseudo_num_per_batch
  - pseudo_rec_weight
