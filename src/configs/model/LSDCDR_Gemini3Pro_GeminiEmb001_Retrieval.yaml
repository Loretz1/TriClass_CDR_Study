# Gemini 3 Pro + Gemini Embedding cold-only semantic retrieval baseline.
only_overlap_users: False
k_cores: 3
shuffle_user_sequence: True
warm_valid_ratio: 0
warm_test_ratio: 0
t_cold_valid: 0.1
t_cold_test: 0.1

warm_eval: False
cold_start_eval: True
req_training: False

training_stages:
  - name: retrieval_only
    state: BOTH
    epochs: 1
    train_batch_size: 2048
    learner: adam
    learning_rate: 0.001
    learning_rate_scheduler: [1.0, 50]
    weight_decay: 0

modalities:
  - name: "CrossDomain_semantics_both_tag_gemini3pro_geminiemb001_cold_only"
    generation_scope: "cold_eval_tgt_only"
    llm_chat_model: "gemini-3-pro-preview"
    emb_model: "gemini-embedding-001"
    emb_batch_size: 1024
    emb_dim: 3072
    emb_pca: 3072
    normalize_semantic_emb: False
    force_embedding_dimensions: false
    max_retry: 3
    num_workers: 2
    request_timeout: 180
    openai_max_retries: 0
    enabled: true

log_model_suffix: gemini3pro_geminiemb001_retrieval

hyper_parameters: []
