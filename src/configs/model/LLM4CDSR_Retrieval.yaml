# Overwrite Dataset Setting
only_overlap_users: False
k_cores: 3
shuffle_user_sequence: True
warm_valid_ratio: 0
warm_test_ratio: 0
t_cold_valid: 0.1
t_cold_test: 0.1

# 1. Eval Setting
warm_eval: False
cold_start_eval: True
req_training: False

# 2. Multi-stage Training Setting
training_stages:
  - name: retrieval_only
    state: BOTH
    epochs: 1
    train_batch_size: 2048
    learner: adam
    learning_rate: 0.001
    learning_rate_scheduler: [1.0, 50]
    weight_decay: 0

modalities:
  - name: "CrossDomain_semantics_LLM4CDSR"
    emb_model: "text-embedding-3-large"
    emb_batch_size: 1024
    emb_dim: 3072
    emb_pca: 3072
    enabled: true
    item_emb_path: "/data/guqiwen/CDRec/data/Amazon2014/Cell_Phones_and_Accessories+Electronics/all_users/WarmValid0_WarmTest0_ColdValid0.1_ColdTest0.1_shuffle/modality_emb/CrossDomain_semantics_both_tag_final_emb_3072.npy"

log_model_suffix: retrieval

hyper_parameters: []
