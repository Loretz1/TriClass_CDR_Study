only_overlap_users: false
k_cores: 3
shuffle_user_sequence: true
warm_valid_ratio: 0
warm_test_ratio: 0
t_cold_valid: 0.1
t_cold_test: 0.1

warm_eval: false
cold_start_eval: true
valid_metric: Recall@20

training_stages:
  - name: both_training
    state: BOTH
    epochs: 1000
    train_batch_size: 2048
    learner: adam
    learning_rate: 0.001
    learning_rate_scheduler: [0.95, 10]
    weight_decay: 0.0001

feature_dim: 64
hidden_dim: 64
GNN: 3
leakey: 0.1
user_batch_size: 64
bce: false
margin: 0.3

log_model_suffix: grounded_backbone_reference
hyper_parameters: []

domain_profiles:
  Book+Music:
    dropout: 0.3
    beta: 1.0
    training_stages:
      - name: both_training
        state: BOTH
        epochs: 1000
        train_batch_size: 2048
        learner: adam
        learning_rate: 0.0005
        learning_rate_scheduler: [0.95, 10]
        weight_decay: 0.0001
  Clothing_Shoes_and_Jewelry+Sports_and_Outdoors:
    dropout: 0.2
    beta: 1.5
  Cell_Phones_and_Accessories+Electronics:
    dropout: 0.3
    beta: 1.0
